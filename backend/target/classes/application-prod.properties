# ============================================
# Guardia-AI — Application Config (Production)
# ============================================

# --- PostgreSQL ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/guardiadb}
spring.datasource.username=${DATABASE_USER:guardiaai}
spring.datasource.password=${DATABASE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# --- JWT ---
guardia.jwt.secret=${JWT_SECRET}
guardia.jwt.expiration=86400000

# --- Firebase ---
guardia.firebase.database-url=${FIREBASE_DATABASE_URL}
guardia.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH}

# --- Gemini ---
guardia.gemini.api-key=${GEMINI_API_KEY}

# --- HIBP ---
guardia.hibp.api-key=${HIBP_API_KEY}
guardia.hibp.enabled=true

# --- Logging ---
logging.level.com.guardiaai=INFO
