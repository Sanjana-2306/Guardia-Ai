# ============================================
# Guardia-AI — Application Config (Dev / H2)
# ============================================
spring.application.name=guardia-ai

# --- H2 In-Memory Database (Dev) ---
spring.datasource.url=jdbc:h2:mem:guardiadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA ---
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
guardia.jwt.secret=GuardiaAI-Super-Secret-Key-Enterprise-HS256-Minimum-256bits-2024
guardia.jwt.expiration=86400000

# --- Firebase (Placeholder — drop firebase-service-account.json in src/main/resources) ---
guardia.firebase.database-url=https://your-project-default-rtdb.firebaseio.com
guardia.firebase.credentials-path=firebase-service-account.json

# --- Gemini AI API ---
guardia.gemini.api-key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
guardia.gemini.model=gemini-1.5-flash
guardia.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models

# --- HIBP Breach Intelligence ---
guardia.hibp.api-key=${HIBP_API_KEY:demo-mode}
guardia.hibp.api-url=https://haveibeenpwned.com/api/v3
guardia.hibp.enabled=false

# --- Server ---
server.port=8080

# --- CORS ---
guardia.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# --- Logging ---
logging.level.com.guardiaai=DEBUG
logging.level.org.springframework.security=WARN
